name: Publish private-history review widget
on:
  push:
    branches: [main]
  schedule:
    # 03:15 JST, once daily. GitHub may delay scheduled runs.
    - cron: "15 18 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
concurrency:
  group: review-widget-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Build only the current review snapshot in temporary files
        run: npm run build
      - name: Prevent customer data from entering Git
        run: |
          set -euo pipefail
          test -z "$(git ls-files reviews.json dist 'reviews-*.png')"
          test -z "$(git log --all --format=%H -- reviews.json dist)"
          git diff --quiet
          test ! -e dist/reviews.json
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify fast display without browser API calls
        run: npm run test:browser
      - uses: actions/configure-pages@v5
      - name: Upload deployment package, not repository files
        id: artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
      - name: Publish current snapshot
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published page
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm run test:browser
      - name: Delete deployment packages and previous review screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "github-pages" or .name == "review-widget-screen-check") | .id' > "$RUNNER_TEMP/review-artifact-ids"
          count=0
          while read -r id; do
            [ -n "$id" ] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            count=$((count + 1))
          done < "$RUNNER_TEMP/review-artifact-ids"
          echo "Deleted temporary review packages: $count"
      - name: Remove local deployment data
        if: always()
        run: rm -rf dist
