name: Review privacy preflight
on:
  push:
    branches: [main]
    paths: [".github/workflows/privacy-preflight.yml"]
permissions:
  contents: read
  actions: write
  pages: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pause the unsafe snapshot writer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/refresh-reviews.yml/disable"
      - name: Use artifact publishing instead of a source branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{build_type,html_url}'
      - name: Remove old review screenshot artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "review-widget-screen-check") | .id' > "$RUNNER_TEMP/review-artifact-ids"
          count=0
          while read -r id; do
            [ -n "$id" ] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            count=$((count + 1))
          done < "$RUNNER_TEMP/review-artifact-ids"
          echo "Removed review screenshot artifacts: $count"
