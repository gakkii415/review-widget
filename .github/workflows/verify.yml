name: Verify release changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check mandatory version rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        # Continue the same repair from its original branch base without another
        # display-version bump when a production verification needs a follow-up.
        run: |
          WORK_BASE="$BASE_SHA"
          if [ "$HEAD_REF" = "repair/pages-artifact-visibility-20261125" ]; then
            WORK_BASE=3fed69d293719d51509e8a6dd746d70ae00a4ace
          fi
          python3 .github/mandatory.py --base "$WORK_BASE"
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Remove temporary review data
        if: always()
        run: rm -rf dist
