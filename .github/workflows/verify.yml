name: Verify release changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check mandatory version rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/mandatory.py --base "$BASE_SHA"
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Remove temporary review data
        if: always()
        run: rm -rf dist
