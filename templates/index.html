<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noimageindex">
<title>Customer reviews</title>
<link rel="stylesheet" href="style.css">
<script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embed');if(window.self!==window.top)document.documentElement.classList.add('framed');</script>
</head>
<body>
<main id="widget">
<h1 class="sr-only">Customer reviews</h1>
<a id="summary" class="summary" hidden target="_blank" rel="noopener noreferrer">
 <strong id="rating" class="rating"></strong>
 <span id="aggregateStars" class="stars" role="img"><span class="stars-fill">★★★★★</span><span aria-hidden="true">★★★★★</span></span>
 <span class="count"><span id="total" hidden></span> reviews on <img src="https://www.gstatic.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" width="74" height="24" alt="Google" loading="lazy" decoding="async"></span>
</a>
<p id="status" class="status" role="status" hidden></p>
<section id="reviews" class="reviews" aria-label="Customer reviews" aria-live="polite"></section>
<div id="actions" class="actions">
 <button id="more" class="button" type="button" hidden>View More &gt;</button>
</div>
<footer><a id="googleLink" hidden></a><a id="backLink" hidden></a><span class="version">v12</span></footer>
</main>
<noscript><p>Enable JavaScript or view customer reviews on Google.</p></noscript>
<!-- REVIEW_DATA -->
<!-- REVIEW_APP -->
</body></html>
